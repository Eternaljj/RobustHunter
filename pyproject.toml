[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robusthunter-graph-matching"
version = "0.1.0"
description = "Paper artifact for the RobustHunter asymmetric provenance-graph matcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
robusthunter-match = "robusthunter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
